<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dan's Chinese Flashcards</title>
<style>
:root{
  --bg:#0d0a0a; --panel:#181312; --ink:#f4ece3; --muted:#9a8a7e;
  --accent:#e25822; --accent-2:#f3a23a; --ok:#5fb377; --bad:#c84f4f;
  --line:#2a201d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent-2);text-decoration:none}
.app{max-width:760px;margin:0 auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
h1 .flame{color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.controls label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px}
select,button,.toggle{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;width:100%;cursor:pointer}
button{transition:transform .05s ease,border-color .15s}
button:hover{border-color:#5a3f36}
button:active{transform:translateY(1px)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:36px 28px;min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(800px 200px at 50% -10%, rgba(226,88,34,.10), transparent 60%);pointer-events:none}
.cat{position:absolute;top:12px;left:16px;font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.idx{position:absolute;top:12px;right:16px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.prompt{font-size:28px;font-weight:500;line-height:1.25;margin:6px 0;max-width:100%;overflow-wrap:anywhere;display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}
.prompt.hanzi{font-size:64px;letter-spacing:.04em}
.prompt-label{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.answer{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);width:100%;display:none}
.answer.show{display:block}
.answer .row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:4px 0;align-items:center}
.answer .pinyin{font-size:22px;color:var(--accent-2)}
.answer .hanzi{font-size:48px;letter-spacing:.04em}
.answer .english{font-size:18px}
.answer .notes{margin-top:10px;font-size:13px;color:var(--muted);font-style:italic}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.btn-flip{grid-column:1/-1;background:linear-gradient(180deg,#2a1f1a,#1a1311);border-color:#3a2a22}
.btn-wrong{background:#3a1d1d;border-color:#5a2a2a;color:#f6c5c5}
.btn-meh{background:#332515;border-color:#5a4226;color:#f3d59c}
.btn-right{background:#1c3324;border-color:#2a5236;color:#bce3c8}
.progress{margin:14px 0 0;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;transition:width .25s}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:#0a0a0a;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.tip{margin-top:14px;font-size:12px;color:var(--muted);text-align:center}
.stats{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
.speak-btn{background:transparent;border:1px solid var(--line);color:var(--accent-2);width:auto;padding:8px 10px;border-radius:50px;font-size:16px;line-height:1;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.speak-btn:hover{border-color:var(--accent);color:var(--accent)}
.speak-btn.speaking{color:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(226,88,34,.15)}
.speak-btn span{font-size:12px;letter-spacing:.5px}
.voice-status{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
@media (max-width:480px){
  .controls{grid-template-columns:1fr}
  .prompt.hanzi{font-size:52px}
  .answer .hanzi{font-size:40px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="flame">🔥</span> Dan's Chinese — XueXi ZhiNan</h1>
    <span class="muted" id="count">— cards</span>
  </header>

  <div class="controls">
    <div>
      <label for="cat">Category</label>
      <select id="cat"><option value="__all__">All categories</option></select>
    </div>
    <div>
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="en2zh">English → Hanzi + Pinyin</option>
        <option value="zh2en">Hanzi → English + Pinyin</option>
        <option value="py2zh">Pinyin → Hanzi + English</option>
        <option value="mixed">Mixed (random direction)</option>
      </select>
    </div>
    <div>
      <label for="order">Order</label>
      <select id="order">
        <option value="srs">Smart (Leitner SRS)</option>
        <option value="shuffle">Shuffle</option>
        <option value="seq">In order</option>
      </select>
    </div>
    <div>
      <label>&nbsp;</label>
      <label class="toggle"><input type="checkbox" id="autoplay"> Auto-play on reveal</label>
    </div>
  </div>

  <div class="card" id="card">
    <span class="cat" id="card-cat"></span>
    <span class="idx" id="card-idx"></span>
    <div class="prompt-label" id="prompt-label"></div>
    <div class="prompt" id="prompt"></div>
    <div class="answer" id="answer">
      <div class="row"><span class="pinyin" id="a-pinyin"></span></div>
      <div class="row">
        <span class="hanzi" id="a-hanzi"></span>
        <button class="speak-btn" id="speak-answer" title="Play (P)">🔊 <span>Play</span></button>
      </div>
      <div class="row"><span class="english" id="a-english"></span></div>
      <div class="notes" id="a-notes"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-flip" id="flip">Flip <span class="kbd">space</span></button>
    <button class="btn-wrong" id="wrong">Again <span class="kbd">1</span></button>
    <button class="btn-meh" id="meh">Hard <span class="kbd">2</span></button>
    <button class="btn-right" id="right">Good <span class="kbd">3</span></button>
  </div>

  <div class="progress">
    <span id="prog-text">Seen 0 / 0</span>
    <span id="prog-acc">— accuracy</span>
  </div>
  <div class="bar"><div id="bar-fill"></div></div>

  <div class="stats" id="stats"></div>

  <div class="voice-status" id="voice-status"></div>

  <div class="tip">
    Shortcuts: <span class="kbd">space</span> flip · <span class="kbd">1</span>/<span class="kbd">2</span>/<span class="kbd">3</span> grade · <span class="kbd">p</span> play audio · <span class="kbd">→</span> next · <span class="kbd">r</span> reset progress
  </div>
</div>

const STORE_KEY = "dan_chinese_v1"; // v1 schema is forward-compatible with v2 features

// ─────────── State persistence ───────────
function loadState(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ return {}; }
}
function saveState(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
let state = loadState();
state.cards = state.cards || {};
state.totalSeen = state.totalSeen || 0;
state.totalCorrect = state.totalCorrect || 0;
state.prefs = state.prefs || {};
function keyOf(c){ return c.category + "|" + c.english + "|" + c.hanzi; }

// ─────────── Categories dropdown ───────────
const cats = [...new Set(CARDS.map(c=>c.category))];
const catSel = document.getElementById("cat");
cats.forEach(c=>{
  const o=document.createElement("option"); o.value=c; o.textContent=c; catSel.appendChild(o);
});
const modeSel = document.getElementById("mode");
const orderSel = document.getElementById("order");
const autoplayChk = document.getElementById("autoplay");

if (state.prefs.cat) catSel.value = state.prefs.cat;
if (state.prefs.mode) modeSel.value = state.prefs.mode;
if (state.prefs.order) orderSel.value = state.prefs.order;
autoplayChk.checked = !!state.prefs.autoplay;

// ─────────── Speech synthesis ───────────
const synth = window.speechSynthesis;
let zhVoice = null;
let voicesLoaded = false;

function pickZhVoice(){
  if (!synth) return null;
  const voices = synth.getVoices();
  if (!voices.length) return null;
  // Prefer mainland zh-CN, then any zh, then nothing
  const ranked = [
    v => v.lang === "zh-CN",
    v => v.lang && v.lang.toLowerCase().startsWith("zh-cn"),
    v => v.lang && v.lang.toLowerCase().startsWith("zh"),
    v => v.lang && v.lang.toLowerCase().includes("mandarin"),
  ];
  for (const test of ranked){
    const found = voices.find(test);
    if (found) return found;
  }
  return null;
}

function refreshVoice(){
  zhVoice = pickZhVoice();
  voicesLoaded = true;
  const status = document.getElementById("voice-status");
  if (!synth){
    status.textContent = "(Audio not supported in this browser)";
  } else if (zhVoice){
    status.textContent = `Voice: ${zhVoice.name} (${zhVoice.lang})`;
  } else {
    status.textContent = "No Chinese voice installed — install a zh-CN voice in OS settings for audio.";
  }
}
if (synth){
  refreshVoice();
  // voices often load asynchronously
  if (synth.onvoiceschanged !== undefined){
    synth.onvoiceschanged = refreshVoice;
  }
  // re-poll briefly
  let pollN = 0;
  const poll = setInterval(()=>{
    if (zhVoice || pollN++ > 10) clearInterval(poll);
    else refreshVoice();
  }, 300);
}

function speak(text){
  if (!synth || !text) return;
  // Strip pinyin/alternative content; keep only the Chinese
  // text may be like "你好 / 您好" — speak the first variant
  const primary = text.split(/[\/／]/)[0].trim();
  if (!primary) return;
  try { synth.cancel(); } catch(e){}
  const u = new SpeechSynthesisUtterance(primary);
  if (zhVoice) u.voice = zhVoice;
  u.lang = "zh-CN";
  u.rate = 0.85;
  u.pitch = 1.0;
  const btn = document.getElementById("speak-answer");
  u.onstart = ()=> btn && btn.classList.add("speaking");
  u.onend = ()=> btn && btn.classList.remove("speaking");
  u.onerror = ()=> btn && btn.classList.remove("speaking");
  synth.speak(u);
}

// ─────────── Deck & rendering ───────────
let deck = [];
let cursor = 0;
let revealed = false;
let current = null;

function buildDeck(){
  const cat = catSel.value;
  let list = (cat==="__all__") ? CARDS.slice() : CARDS.filter(c=>c.category===cat);
  const order = orderSel.value;
  if (order==="shuffle"){
    for (let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  } else if (order==="srs"){
    list.sort((a,b)=>{
      const sa = state.cards[keyOf(a)] || {box:0,lastSeen:0};
      const sb = state.cards[keyOf(b)] || {box:0,lastSeen:0};
      if (sa.box !== sb.box) return sa.box - sb.box;
      return (sa.lastSeen||0) - (sb.lastSeen||0);
    });
  }
  deck = list;
  cursor = 0;
  render();
}

function pickMode(){
  const m = modeSel.value;
  if (m==="mixed"){
    const modes=["en2zh","zh2en","py2zh"];
    return modes[Math.floor(Math.random()*modes.length)];
  }
  return m;
}

function makeInlinePlayBtn(text){
  // Returns an HTML string for a play button to inline next to hanzi prompt
  return ` <button class="speak-btn" data-speak="${encodeURIComponent(text)}" title="Play (P)">🔊</button>`;
}

function render(){
  document.getElementById("count").textContent = deck.length + " cards";
  if (!deck.length){
    document.getElementById("prompt").textContent = "(empty deck)";
    return;
  }
  if (cursor >= deck.length) cursor = 0;
  current = deck[cursor];
  const m = pickMode();
  current._mode = m;
  document.getElementById("card-cat").textContent = current.category;
  document.getElementById("card-idx").textContent = (cursor+1) + " / " + deck.length;

  const prompt = document.getElementById("prompt");
  const plabel = document.getElementById("prompt-label");
  prompt.classList.remove("hanzi");
  if (m==="en2zh"){
    plabel.textContent = "English"; prompt.textContent = current.english;
  } else if (m==="zh2en"){
    plabel.textContent = "Hanzi";
    prompt.classList.add("hanzi");
    prompt.innerHTML = "";
    const span = document.createElement("span");
    span.textContent = current.hanzi;
    prompt.appendChild(span);
    const btn = document.createElement("button");
    btn.className = "speak-btn";
    btn.title = "Play (P)";
    btn.innerHTML = "🔊";
    btn.onclick = (e)=>{ e.stopPropagation(); speak(current.hanzi); };
    prompt.appendChild(btn);
  } else { // py2zh
    plabel.textContent = "Pinyin + English";
    prompt.innerHTML = current.pinyin + '<div style="font-size:16px;color:var(--muted);margin-top:8px;width:100%">' + current.english + '</div>';
  }
  document.getElementById("a-pinyin").textContent = current.pinyin;
  document.getElementById("a-hanzi").textContent = current.hanzi;
  document.getElementById("a-english").textContent = current.english;
  document.getElementById("a-notes").textContent = current.notes || "";
  document.getElementById("answer").classList.remove("show");
  revealed = false;
  updateProgress();
}

function flip(){
  revealed = !revealed;
  document.getElementById("answer").classList.toggle("show", revealed);
  if (revealed && autoplayChk.checked && current){
    speak(current.hanzi);
  }
}

function grade(result){
  if (!current) return;
  if (!revealed){ flip(); return; }
  const k = keyOf(current);
  const s = state.cards[k] || {box:0,seen:0,correct:0,lastSeen:0};
  s.seen += 1;
  state.totalSeen += 1;
  if (result==="right"){ s.box = Math.min(5, s.box+1); s.correct += 1; state.totalCorrect += 1; }
  else if (result==="meh"){ s.box = Math.max(0, s.box); }
  else { s.box = 0; }
  s.lastSeen = Date.now();
  state.cards[k] = s;
  saveState(state);
  next();
}

function next(){
  cursor = (cursor+1) % deck.length;
  render();
}

function updateProgress(){
  const total = deck.length;
  const seen = deck.filter(c => (state.cards[keyOf(c)]||{}).seen).length;
  document.getElementById("prog-text").textContent = "Studied " + seen + " / " + total;
  const acc = state.totalSeen ? Math.round(100*state.totalCorrect/state.totalSeen) : 0;
  document.getElementById("prog-acc").textContent = state.totalSeen ? (acc + "% accuracy (" + state.totalCorrect + "/" + state.totalSeen + ")") : "— accuracy";
  document.getElementById("bar-fill").style.width = total? (100*seen/total)+"%" : "0%";
  const boxes=[0,0,0,0,0,0];
  deck.forEach(c=>{ const s=state.cards[keyOf(c)]; boxes[s? s.box : 0]++; });
  document.getElementById("stats").innerHTML =
    boxes.map((n,i)=>`<span>Box ${i}: <b>${n}</b></span>`).join("");
}

// ─────────── Events ───────────
document.getElementById("flip").onclick = flip;
document.getElementById("wrong").onclick = ()=>grade("wrong");
document.getElementById("meh").onclick = ()=>grade("meh");
document.getElementById("right").onclick = ()=>grade("right");
document.getElementById("speak-answer").onclick = (e)=>{ e.stopPropagation(); if (current) speak(current.hanzi); };

[catSel, orderSel].forEach(el => el.onchange = ()=>{
  state.prefs.cat = catSel.value; state.prefs.order = orderSel.value; state.prefs.mode = modeSel.value;
  saveState(state); buildDeck();
});
modeSel.onchange = ()=>{ state.prefs.mode = modeSel.value; saveState(state); render(); };
autoplayChk.onchange = ()=>{ state.prefs.autoplay = autoplayChk.checked; saveState(state); };

document.addEventListener("keydown", (e)=>{
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.code==="Space"){ e.preventDefault(); flip(); }
  else if (e.key==="1"){ grade("wrong"); }
  else if (e.key==="2"){ grade("meh"); }
  else if (e.key==="3"){ grade("right"); }
  else if (e.key==="ArrowRight"){ next(); }
  else if (e.key.toLowerCase()==="p"){ if (current) speak(current.hanzi); }
  else if (e.key.toLowerCase()==="r"){
    if (confirm("Reset all progress (boxes, accuracy)? Cards themselves stay loaded.")){
      state.cards = {}; state.totalSeen = 0; state.totalCorrect = 0;
      saveState(state); buildDeck();
    }
  }
});

buildDeck();
</script>
</body>
</html>
